name: Fix Admin Chat User Search

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-search:
    if: github.event.head_commit.message != 'Fix admin chat user-only search'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace search function
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js'); s=p.read_text(encoding='utf-8'); start=s.index('    function applyChatFilters() {'); end=s.index('    /* =========================================================\\n       CHAT LIST CLICK', start); r=base64.b64decode('  aXNpYmxlID0gdmlzaWJsZUl0ZW1zID4gMDsKICAgICAgICAgICAgZ3JvdXAuaGlkZGVuID0gIWdyb3VwVmlzaWJsZTsKICAgICAgICAgICAgZ3JvdX Auc2V0QXR0cmlidXRlKCdhcmlhLWhpZGRlbicsIFN0cmluZyghZ3JvdXBW  header.setAttribute('aria-expanded', 'true');').decode(); p.write_text(s[:start]+r+s[end:],encoding='utf-8')"
          rm -f .github/workflows/fix-admin-chat-user-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js .github/workflows/fix-admin-chat-user-search.yml
          git commit -m "Fix admin chat user-only search"
          git push origin main
