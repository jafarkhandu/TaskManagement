name: Fix Admin Chat User Search Order

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply user-only search ordering
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('ICAgICAgICBncm91cHMuZm9yRWFjaChmdW5jdGlvbiAoZ3JvdXApIHs=').decode(); new=base64.b64decode('').decode(); assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          python3 -c "import base64; from pathlib import Path; p=Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('ICAgICAgICAgICAgZ3JvdXAuc3R5bGUuZGlzcGxheSA9CiAgICAgICAgICAgICAgICBncm91cFZpc2libGUgPyAnJyA6ICdub25lJzs=').decode(); new=base64.b64decode('ICAgICAgICAgICAgZ3JvdXAuc3R5bGUuZGlzcGxheSA9CiAgICAgICAgICAgICAgICBncm91cFZpc2libGUgPyAnJyA6ICdub25lJzsKCiAgICAgICAgICAgIGlmIChoYXNTZWFyY2ggJiYgZ3JvdXBWaXNpYmxlKSB7CiAgICAgICAgICAgICAgICBhZG1pbkNoYXRMaXN0LmFwcGVuZENoaWxkKGdyb3VwKTsKICAgICAgICAgICAgfQ==').decode(); assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Verify and remove workflow
        run: |
          grep -n "orderedGroups" TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          grep -n "appendChild(group)" TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          rm -f .github/workflows/temp-user-search-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js .github/workflows/temp-user-search-order.yml
          git commit -m "Fix admin chat user search ordering"
          git push origin main
