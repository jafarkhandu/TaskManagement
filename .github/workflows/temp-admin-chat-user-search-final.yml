name: Temporary Admin Chat User Search Finalize

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize admin chat user search') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix search expression
        shell: bash
        run: |
          sed -i 's/                    groupMatchesSearch ||$/                    groupMatchesSearch;/' TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
      - name: Verify and commit
        shell: bash
        run: |
          grep -n -A3 -B2 "const matchesSearch" TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          rm .github/workflows/temp-admin-chat-user-search-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js .github/workflows/temp-admin-chat-user-search-final.yml
          git commit -m "Finalize admin chat user search"
          git push
