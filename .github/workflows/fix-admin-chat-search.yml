name: Fix Admin Chat Search Scope

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped chat search
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js')
          css_path = Path('TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css')

          js = js_path.read_text(encoding='utf-8-sig')
          old = """                const matchesSearch =
                    !search ||
                    (groupMatchesSearch ? true : itemMatchesSearch);"""
          new = """                // Searching a user shows that user's group.
                // Searching a task/message shows only the matching conversation.
                const matchesSearch =
                    !search ||
                    groupMatchesSearch ||
                    itemMatchesSearch;"""
          if old not in js:
              raise SystemExit('Expected chat search block not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8', newline='')

          css = css_path.read_text(encoding='utf-8-sig')
          rule = """\n#adminChatList .admin-chat-item[hidden] {
    display: none !important;
}
"""
          if rule.strip() not in css:
              css += rule
              css_path.write_text(css, encoding='utf-8', newline='')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css .github/workflows/fix-admin-chat-search.yml
          git diff --cached --check || true
          git commit -m "Fix admin chat search filtering"
          git push origin main
