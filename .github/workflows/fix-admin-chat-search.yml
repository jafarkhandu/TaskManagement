name: Fix Admin Chat Search Scope

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped chat search
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js')
          css_path = Path('TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css')

          js = js_path.read_text(encoding='utf-8-sig')
          old = "                const matchesSearch =\n                    !search ||\n                    (groupMatchesSearch ? true : itemMatchesSearch);"
          new = "                const matchesSearch =\n                    !search ||\n                    groupMatchesSearch ||\n                    itemMatchesSearch;"
          if old not in js:
              raise SystemExit('Expected chat search block not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8', newline='')

          css = css_path.read_text(encoding='utf-8-sig')
          rule = "\n#adminChatList .admin-chat-item[hidden] {\n    display: none !important;\n}\n"
          if rule.strip() not in css:
              css_path.write_text(css.rstrip() + rule, encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/fix-admin-chat-search.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css .github/workflows/fix-admin-chat-search.yml
          git diff --cached --check || true
          git commit -m "Fix admin chat search filtering"
          git push origin main
