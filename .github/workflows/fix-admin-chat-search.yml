name: Apply admin chat search fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-admin-chat-search.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped chat search behavior
        shell: python
        run: |
          from pathlib import Path
          js_path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js')
          css_path = Path('TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css')
          js = js_path.read_text(encoding='utf-8-sig')
          old = '''                const matchesSearch =
                    !search ||
                    (groupMatchesSearch ? true : itemMatchesSearch);
'''
          new = '''                // Searching a user shows that user's group.
                // Searching a task/message shows only the matching conversation.
                const matchesSearch =
                    !search ||
                    groupMatchesSearch ||
                    itemMatchesSearch;
'''
          if old not in js:
              raise SystemExit('Expected chat search block was not found.')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8', newline='')
          css = css_path.read_text(encoding='utf-8-sig')
          marker = '''#adminChatList .admin-chat-student-tasks[hidden],
#adminChatList .admin-chat-student-group.collapsed .admin-chat-student-tasks {
    display: none !important;
}
'''
          rule = '''
#adminChatList .admin-chat-item[hidden] {
    display: none !important;
}
'''
          if rule.strip() not in css:
              if marker not in css:
                  raise SystemExit('Expected chat hidden-state CSS marker was not found.')
              css_path.write_text(css.replace(marker, marker + rule, 1), encoding='utf-8', newline='')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js TaskManagement.WebApp/wwwroot/css/admin/admin-chat.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: scope admin chat search results"
          git push