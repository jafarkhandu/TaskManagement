name: Temporary Admin Chat User Search Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix admin chat user search') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply user-only search fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js')
          view_path = Path('TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml')

          js = js_path.read_text(encoding='utf-8')
          old = """                const itemMatchesSearch =
                    !search ||
                    text.includes(search);

                const matchesSearch =
                    !search ||
                    groupMatchesSearch ||
                    itemMatchesSearch;
"""
          new = """                const matchesSearch =
                    !search ||
                    groupMatchesSearch;
"""

          if old not in js:
              raise SystemExit('Expected chat search block was not found.')

          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          view = view_path.read_text(encoding='utf-8')
          old_placeholder = 'placeholder="Search chats..."'
          new_placeholder = 'placeholder="Search users..."'

          if old_placeholder not in view:
              raise SystemExit('Expected chat search placeholder was not found.')

          view_path.write_text(view.replace(old_placeholder, new_placeholder, 1), encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -n -A8 -B4 "const matchesSearch" TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          grep -n "Search users" TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml
          rm .github/workflows/temp-admin-chat-user-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml .github/workflows/temp-admin-chat-user-search.yml
          git commit -m "Fix admin chat user search"
          git push
