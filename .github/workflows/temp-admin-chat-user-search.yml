name: Temporary Admin Chat User Search Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix admin chat user search') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply user-only search fix
        shell: bash
        run: |
          sed -i '/const itemMatchesSearch =/,/text.includes(search);/d' TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          sed -i '/                    itemMatchesSearch;/d' TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          sed -i 's/placeholder="Search chats..."/placeholder="Search users..."/' TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml

      - name: Verify and commit
        shell: bash
        run: |
          grep -n -A6 -B3 "const matchesSearch" TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          grep -n "Search users" TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml
          rm .github/workflows/temp-admin-chat-user-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js TaskManagement.WebApp/Areas/Admin/Views/Chat/Index.cshtml .github/workflows/temp-admin-chat-user-search.yml
          git commit -m "Fix admin chat user search"
          git push
