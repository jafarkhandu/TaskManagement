name: Fix Chat Search

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix chat search filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js')
          text = path.read_text(encoding='utf-8-sig')
          pattern = r"\s*const groupMatchesSearch =\s*!search \|\| groupName\.includes\(search\);\s*\n\s*let visibleItems = 0;"
          text, count = re.subn(pattern, "\n\n            let visibleItems = 0;", text, count=1)
          if count != 1:
              raise SystemExit('Expected group search block not found')
          pattern = r"const matchesSearch =\s*!search \|\|\s*groupMatchesSearch \|\|\s*text\.includes\(search\);"
          text, count = re.subn(pattern, "const matchesSearch =\n                    !search ||\n                    text.includes(search);", text, count=1)
          if count != 1:
              raise SystemExit('Expected matchesSearch block not found')
          pattern = r"item\.style\.display =\s*visible \? '' : 'none';"
          text, count = re.subn(pattern, "item.hidden = !visible;\n                item.setAttribute('aria-hidden', String(!visible));", text, count=1)
          if count != 1:
              raise SystemExit('Expected item display block not found')
          path.write_text(text, encoding='utf-8', newline='')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-chat.js
          git diff --cached --check || true
          git commit -m "Fix admin chat search filtering" || exit 0
          git push origin main
