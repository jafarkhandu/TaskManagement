name: Temporary Add Task Reset Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-add-task-reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Add Task reset behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-tasks.js')
          text = path.read_text(encoding='utf-8-sig')

          old = """        document.getElementById(
              'addTaskModal'
          )?.addEventListener(
              'shown.bs.modal',
              async function () {
                  assignableUsers = await fetchAssignableUsers();

                  if (addAssignedToSearch) {
                      addAssignedToSearch.value = '';
                  }

                  if (addAssignedTo) {
                      addAssignedTo.value = '';
                  }

                  if (addAssignedToOptions) {
                      addAssignedToOptions.classList.remove('show');
                  }
              }
          );"""

          new = """        document.getElementById(
              'addTaskModal'
          )?.addEventListener(
              'shown.bs.modal',
              async function () {
                  // Always start Add Task with a clean form when the modal opens.
                  addTaskForm?.reset();

                  const addTaskError = document.getElementById('addTaskError');
                  if (addTaskError) {
                      addTaskError.textContent = '';
                      addTaskError.style.display = 'none';
                  }

                  if (addAssignedToSearch) {
                      addAssignedToSearch.value = '';
                  }

                  if (addAssignedTo) {
                      addAssignedTo.value = '';
                  }

                  if (addAssignedToOptions) {
                      addAssignedToOptions.classList.remove('show');
                  }

                  assignableUsers = await fetchAssignableUsers();
              }
          );"""

          if old not in text:
              raise SystemExit('Expected Add Task modal handler was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8-sig')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-tasks.js .github/workflows/temporary-add-task-reset.yml
          git commit -m 'Fix stale Add Task form data [skip ci]'
          git rm .github/workflows/temporary-add-task-reset.yml
          git commit --amend --no-edit
          git push origin HEAD:main
