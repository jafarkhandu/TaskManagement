name: Temporary Add Task Reset Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-add-task-reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Add Task reset behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('TaskManagement.WebApp/wwwroot/js/admin/admin-tasks.js')
          text = path.read_text(encoding='utf-8-sig')

          marker = """        addTaskForm?.addEventListener(\n            'submit',\n"""

          insertion = """        document.getElementById(\n            'addTaskModal'\n        )?.addEventListener(\n            'hidden.bs.modal',\n            function () {\n                addTaskForm?.reset();\n\n                const addTaskError =\n                    document.getElementById('addTaskError');\n\n                if (addTaskError) {\n                    addTaskError.textContent = '';\n                    addTaskError.style.display = 'none';\n                }\n\n                if (addAssignedToSearch) {\n                    addAssignedToSearch.value = '';\n                }\n\n                if (addAssignedTo) {\n                    addAssignedTo.value = '';\n                }\n\n                if (addAssignedToOptions) {\n                    addAssignedToOptions.classList.remove('show');\n                }\n            }\n        );\n\n\n"""

          if marker not in text:
              raise SystemExit('Expected Add Task submit handler was not found; refusing to modify the file.')

          if "'hidden.bs.modal'" in text and "addTaskForm?.reset();" in text:
              raise SystemExit('Add Task reset patch already exists; refusing duplicate modification.')

          path.write_text(
              text.replace(marker, insertion + marker, 1),
              encoding='utf-8-sig'
          )

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TaskManagement.WebApp/wwwroot/js/admin/admin-tasks.js .github/workflows/temporary-add-task-reset.yml
          git commit -m 'Fix stale Add Task form data [skip ci]'
          git rm .github/workflows/temporary-add-task-reset.yml
          git commit --amend --no-edit
          git push origin HEAD:main
